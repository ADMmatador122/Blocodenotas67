<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Bloco de Notas</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --text: #1e293b;
            --white: #ffffff;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
        }

        /* Sidebar: Lista de Notas */
        .sidebar {
            width: 300px;
            background: var(--white);
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        .btn-new {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #notesList {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .note-item {
            padding: 15px 20px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            transition: background 0.2s;
        }

        .note-item:hover { background: #f1f5f9; }
        .note-item.active { border-left: 4px solid var(--primary); background: #eff6ff; }
        .note-item h4 { margin: 0 0 5px 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .note-item small { color: #64748b; font-size: 12px; }

        /* Área de Edição */
        .editor {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--white);
        }

        .editor-header {
            padding: 10px 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            border-bottom: 1px solid #e2e8f0;
        }

        #noteTitle {
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            border: none;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        #noteContent {
            flex: 1;
            padding: 20px;
            font-size: 16px;
            border: none;
            outline: none;
            resize: none;
            line-height: 1.6;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-delete { background: var(--danger); color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        
        /* Ocultar editor se não houver nota selecionada */
        .hidden { display: none !important; }
        .placeholder { flex: 1; display: flex; align-items: center; justify-content: center; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <button class="btn-new" onclick="createNewNote()">+ Nova Nota</button>
        </div>
        <ul id="notesList"></ul>
    </div>

    <div id="editorContainer" class="editor hidden">
        <div class="editor-header">
            <button class="btn-delete" onclick="deleteNote()">Excluir</button>
        </div>
        <input type="text" id="noteTitle" placeholder="Título da nota...">
        <textarea id="noteContent" placeholder="Comece a escrever..."></textarea>
    </div>

    <div id="noNoteSelected" class="placeholder">
        <p>Selecione ou crie uma nota para começar</p>
    </div>

    <script>
        let notes = JSON.parse(localStorage.getItem('my_notes_app')) || [];
        let currentNoteId = null;

        const notesListEl = document.getElementById('notesList');
        const editorContainer = document.getElementById('editorContainer');
        const placeholderEl = document.getElementById('noNoteSelected');
        const titleInput = document.getElementById('noteTitle');
        const contentInput = document.getElementById('noteContent');

        function saveToStorage() {
            localStorage.setItem('my_notes_app', JSON.stringify(notes));
            renderNotesList();
        }

        function createNewNote() {
            const newNote = {
                id: Date.now(),
                title: "Nova Nota",
                content: "",
                date: new Date().toLocaleDateString('pt-BR')
            };
            notes.unshift(newNote);
            saveToStorage();
            selectNote(newNote.id);
        }

        function renderNotesList() {
            notesListEl.innerHTML = '';
            notes.forEach(note => {
                const li = document.createElement('li');
                li.className = `note-item ${note.id === currentNoteId ? 'active' : ''}`;
                li.innerHTML = `
                    <h4>${note.title || 'Sem título'}</h4>
                    <small>${note.date}</small>
                `;
                li.onclick = () => selectNote(note.id);
                notesListEl.appendChild(li);
            });
        }

        function selectNote(id) {
            currentNoteId = id;
            const note = notes.find(n => n.id === id);
            
            if (note) {
                titleInput.value = note.title;
                contentInput.value = note.content;
                editorContainer.classList.remove('hidden');
                placeholderEl.classList.add('hidden');
            }
            renderNotesList();
        }

        function deleteNote() {
            if (confirm("Deseja mesmo excluir esta nota?")) {
                notes = notes.filter(n => n.id !== currentNoteId);
                currentNoteId = null;
                editorContainer.classList.add('hidden');
                placeholderEl.classList.remove('hidden');
                saveToStorage();
            }
        }

        // Eventos de digitação para salvar automaticamente
        [titleInput, contentInput].forEach(el => {
            el.addEventListener('input', () => {
                const note = notes.find(n => n.id === currentNoteId);
                if (note) {
                    note.title = titleInput.value;
                    note.content = contentInput.value;
                    saveToStorage();
                }
            });
        });

        // Inicialização
        renderNotesList();
    </script>
</body>
</html>
